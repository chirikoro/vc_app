[package]
name = "vc-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ボイスチェンジャー GUI(egui)"
default-run = "vc-app"

[[bin]]
name = "vc-app"
path = "src/main.rs"

[features]
default = ["preview"]
# 変換結果の試聴(rodio)。不要なら `--no-default-features` で外せる。
preview = ["dep:rodio"]

[dependencies]
vc-core.workspace = true
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
rodio = { version = "0.22", optional = true, default-features = false, features = ["wav", "playback"] }
open = "5"
