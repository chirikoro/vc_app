[package]
name = "vc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ボイスチェンジャーのコア処理(音声入出力・ピッチ/フォルマント変換・一括処理)"
build = "build.rs"

[lib]
name = "vc_core"
path = "src/lib.rs"

[[bin]]
name = "vc-cli"
path = "src/bin/vc-cli.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rayon = "1.10"
hound = "3.5"
flacenc = { version = "0.5", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "mp3", "vorbis", "ogg", "isomp4", "aac", "aiff", "pcm", "adpcm"] }
directories = "6"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
